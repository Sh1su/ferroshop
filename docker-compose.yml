services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ferroshop
      POSTGRES_PASSWORD: ferroshop
      POSTGRES_DB: ferroshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferroshop"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ferroshop
      MINIO_ROOT_PASSWORD: ferroshop-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["s3"]

volumes:
  pgdata:
