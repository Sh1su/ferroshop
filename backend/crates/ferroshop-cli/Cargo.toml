[package]
name = "ferroshop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
ferroshop-admin-api = { version = "0.1.0", path = "../ferroshop-admin-api" }
ferroshop-core = { version = "0.1.0", path = "../ferroshop-core" }
ferroshop-store-api = { version = "0.1.0", path = "../ferroshop-store-api" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
