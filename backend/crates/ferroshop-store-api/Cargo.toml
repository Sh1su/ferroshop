[package]
name = "ferroshop-store-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
ferroshop-admin-api = { version = "0.1.0", path = "../ferroshop-admin-api" }
ferroshop-core = { version = "0.1.0", path = "../ferroshop-core" }
hex = "0.4.3"
rand = "0.10.3"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "rust_decimal", "json"] }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
