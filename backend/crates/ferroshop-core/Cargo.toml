[package]
name = "ferroshop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
object_store = { version = "0.14.2", features = ["aws"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-float", "serde-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
bytes = { version = "1.12.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
