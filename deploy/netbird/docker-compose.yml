# ferroshop behind NetBird: the app is only published on the NetBird interface,
# the database is not published at all.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
name: ferroshop-netbird

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferroshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ferroshop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferroshop"]
      interval: 5s
      retries: 30

  app:
    build: ../..
    image: ferroshop:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ferroshop:${POSTGRES_PASSWORD}@db:5432/ferroshop
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      RUST_LOG: ${RUST_LOG:-info}
      MEDIA_STORAGE: /var/lib/ferroshop/media
    volumes:
      - media:/var/lib/ferroshop/media
    ports:
      - "${NETBIRD_IP:?set NETBIRD_IP}:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  media:
